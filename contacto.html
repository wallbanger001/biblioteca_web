<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ===== HEAD / METADATOS ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - BiblioNico's</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <!-- ===== TÍTULO DE CONTACTO ===== -->
    <h1 id="titulo_contacto">Nuestros Contactos</h1>

    <!-- ===== HEADER / NAVEGACIÓN ===== -->
    <header>
        <nav>
            <p><a href="index.html">Volver al inicio</a></p>
        </nav>
    </header>

    <!-- ===== MAIN / CONTACTO Y FORMULARIO ===== -->
    <main>
        <!-- Línea de contacto -->
        <p>Numero contacto: 924235990</p>

        <!-- Formulario de contacto -->
        <form action="#" method="post">
            <div class="encuadre">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">
            </div>

            <div class="encuadre">
                <label for="gmail">Gmail:</label>
                <input type="email" id="gmail" name="gmail">
            </div>

            <div class="encuadre">
                <label for="numero">Numero:</label>
                <input type="tel" id="numero" name="numero">
            </div>

            <div class="encuadre">
                <label for="libro">Libro de interés:</label>
                <select id="libro" name="libro">
                    <option value="Cien-anos-de-soledad">Cien años de soledad</option>
                    <option value="principito">El principito</option>
                    <option value="1984">1984</option>
                    <option value="Don-Quijote">Don Quijote de la Mancha</option>
                </select>
            </div>

            <div class="encuadre">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4"></textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 BiblioNico's</p>
    </footer>
</body>
</html>
