<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ===== HEAD / METADATOS ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>BiblioNico's</title>
</head>
<body>

    <!-- ===== TABLA / CATÁLOGO DE LIBROS ===== -->
    <div class="tabla">
        <table>
            <caption>Catálogo de libros</caption>
            <thead>
                <tr>
                    <th>Libro</th>
                    <th>Autor</th>
                    <th>Copias disponibles</th>
                    <th>Próxima devolución</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Cien años de soledad</td>
                    <td>Gabriel García Márquez</td>
                    <td>2</td>
                    <td>12/10/2026</td>
                </tr>
                <tr>
                    <td>El principito</td>
                    <td>Antoine de Saint-Exupéry</td>
                    <td>1</td>
                    <td>10/10/2026</td>
                </tr>
                <tr>
                    <td>1984</td>
                    <td>George Orwell</td>
                    <td>0</td>
                    <td>09/10/2026</td>
                </tr>
                <tr>
                    <td>Don Quijote de la Mancha</td>
                    <td>Miguel de Cervantes</td>
                    <td>1</td>
                    <td>14/10/2026</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Libros sin copias disponibles</td>
                    <td>1</td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>
</html>
